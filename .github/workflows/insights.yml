name: Collect engagement numbers

# Daily snapshot of followers and per-post engagement, for the twice-monthly growth review.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["checks/INSIGHTS"]

permissions:
  contents: write


concurrency: ${{ github.workflow }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python pipeline/insights.py
      - name: Save
        run: |
          git config user.name "insights-bot"; git config user.email "actions@users.noreply.github.com"
          git add insights
          git diff --cached --quiet || (git commit -qm "Engagement snapshot $(date -u +%F)" && git pull --rebase -q && git push -q)
