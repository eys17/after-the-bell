name: Publish to Instagram

on:
  push:
    branches: [main]
    paths: ["posts/**/APPROVED"]
  workflow_dispatch:
    inputs:
      date:
        description: "Post date (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Find the post to publish
        id: which
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "dates=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            d=$(git diff --name-only HEAD~1 HEAD -- 'posts/*/APPROVED' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "dates=$d" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          for d in ${{ steps.which.outputs.dates }}; do python pipeline/publish.py "$d"; done
      - name: Record what was published
        run: |
          git config user.name "after-the-bell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/*/PUBLISHED || true
          git diff --cached --quiet || (git commit -m "Published $(date -u +%F)" && git push)
