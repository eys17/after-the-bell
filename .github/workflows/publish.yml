name: Publish to Instagram

on:
  push:
    branches: [main]
    paths: ["posts/**/APPROVED"]
  schedule:
    - cron: "17 14-23 * * 0"   # Sunday from ~9am New York, hourly until it is out (GitHub can skip a slot)
  workflow_dispatch:
    inputs:
      date:
        description: "Post date (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

concurrency: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Find the post to publish
        id: which
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "dates=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            d=$(TZ=America/New_York date +%F)
            if [ -f "posts/$d/APPROVED" ] && [ ! -f "posts/$d/PUBLISHED" ]; then echo "dates=$d" >> "$GITHUB_OUTPUT"; else echo "dates=" >> "$GITHUB_OUTPUT"; fi
          else
            d=$(git diff --name-only HEAD~1 HEAD -- 'posts/*/APPROVED' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "dates=$d" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          mkdir -p checks; rc=0
          for d in ${{ steps.which.outputs.dates }}; do
            python pipeline/publish.py "$d" 2>&1 | tee -a checks/publish.log; [ "${PIPESTATUS[0]}" = 0 ] || rc=1
          done
          exit $rc
      - name: Record what was published
        if: always()
        run: |
          git config user.name "after-the-bell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/*/PUBLISHED checks/publish.log 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Published $(date -u +%F)" && git pull --rebase -q && git push)
